<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Poem for Sheilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #fb7185;
            --primary-hover: #f43f5e;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            background-image:
                radial-gradient(circle at top right, rgba(251, 113, 133, 0.15), transparent 40%),
                radial-gradient(circle at bottom left, rgba(14, 165, 233, 0.1), transparent 40%);
            color: var(--text-main);
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            box-sizing: border-box;
            perspective: 1000px;
            z-index: 10;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3.5rem 2rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s ease;
            animation: fadeIn 1s ease-out;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #fb7185, #f43f5e, #fb7185);
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(251, 113, 133, 0.15);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .heart-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(251, 113, 133, 0.1);
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
        }

        .heart-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 15px rgba(251, 113, 133, 0.6));
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 0 0 rgba(251, 113, 133, 0.4);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(251, 113, 133, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(251, 113, 133, 0);
            }
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.15);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.15);
            }
        }

        h1 {
            margin: 0 0 1rem;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #fb7185);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-size: 1.05rem;
            padding: 0 1rem;
        }

        .send-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 1.1rem 2.2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px -5px rgba(251, 113, 133, 0.5);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .send-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 60%);
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.3s, transform 0.5s;
        }

        .send-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 25px -5px rgba(251, 113, 133, 0.6);
        }

        .send-btn:hover::after {
            opacity: 1;
            transform: scale(1);
        }

        .send-btn span {
            position: relative;
            z-index: 1;
        }

        .send-btn svg {
            position: relative;
            z-index: 1;
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .send-btn:hover svg {
            transform: translateX(4px) translateY(-4px);
        }

        .poem-display {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(251, 113, 133, 0.2);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e2e8f0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            transition: opacity 0.5s ease;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .generate-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: transparent;
            color: var(--primary);
            text-decoration: none;
            padding: 1.1rem 1.8rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--primary);
            cursor: pointer;
        }

        .generate-btn:hover {
            background: rgba(251, 113, 133, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(251, 113, 133, 0.3);
        }

        .generate-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.5s ease;
        }

        .generate-btn:hover svg {
            transform: rotate(180deg);
        }

        .floating-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>

<body>
    <div class="floating-particles" id="particles"></div>
    <div class="container">
        <div class="card">
            <div class="heart-container">
                <div class="heart-icon">💝</div>
            </div>
            <h1>For Sheilla</h1>
            <p>Click below to open your email client with a special poem ready to send to Sheilla.</p>

            <div id="poem-display" class="poem-display">
                <!-- Poem will be inserted here -->
            </div>

            <div class="action-buttons">
                <button id="generate-btn" class="generate-btn">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                    <span>New Poem</span>
                </button>

                <!-- Mailto link heavily URI encoded to preserve line breaks -->
                <a id="send-btn" href="#" class="send-btn">
                    <span>Send the Poem</span>
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Poem Generator Logic
        const lines1 = [
            "In quiet moments when the world is still,",
            "When morning light breaks through the gentle skies,",
            "As evening shadows fall across the hill,",
            "Through shifting seasons and the years that pass,",
            "Whenever whispered breezes touch the trees,"
        ];

        const lines2 = [
            "My soaring thoughts of you the silence fill.",
            "I find my joy reflected in your eyes.",
            "Your memory remains a vivid thrill.",
            "My heart recalls the beauty of your laugh.",
            "I feel your spirit carried on the breeze."
        ];

        const lines3 = [
            "With every dawn and every star above,",
            "In every melody and sweetest song,",
            "No matter where my wandering steps may bound,",
            "Like gentle rivers flowing to the sea,",
            "Beyond the limits of the painted sky,"
        ];

        const lines4 = [
            "You are the endless center of my love.",
            "It is beside your soul that I belong.",
            "In you my greatest treasure I have found.",
            "My truest path will always lead to thee.",
            "My love for you will never fade or die."
        ];

        function getRandomLine(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function generatePoem() {
            const poemDisplay = document.getElementById('poem-display');
            
            // Fade out
            poemDisplay.style.opacity = '0';
            
            setTimeout(() => {
                // Generate new poem
                const line1 = getRandomLine(lines1);
                const line2 = getRandomLine(lines2);
                const line3 = getRandomLine(lines3);
                const line4 = getRandomLine(lines4);
                
                const poemHTML = `${line1}<br>${line2}<br>${line3}<br>${line4}`;
                const rawPoemText = `${line1}\n${line2}\n${line3}\n${line4}`;
                
                // Update display
                poemDisplay.innerHTML = poemHTML;
                
                // Update mailto link
                const subject = encodeURIComponent("A Poem For You");
                const body = encodeURIComponent(`Dear Sheilla,\n\n${rawPoemText}\n\nForever yours,\nYann`);
                const mailtoUrl = `mailto:sheilla@example.com?subject=${subject}&body=${body}`;
                
                document.getElementById('send-btn').href = mailtoUrl;
                
                // Fade in
                poemDisplay.style.opacity = '1';
            }, 300); // Wait for fade out
        }

        // Initialize generator events
        document.getElementById('generate-btn').addEventListener('click', generatePoem);
        
        // Generate initial poem
        generatePoem();

        // Simple particle effect for extra aesthetics
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 20;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = Math.random() * 4 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = 'rgba(251, 113, 133, ' + (Math.random() * 0.3 + 0.1) + ')';
                particle.style.borderRadius = '50%';

                // Random positioning
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.top = Math.random() * 100 + 'vh';

                // Random animation
                const duration = Math.random() * 20 + 10;
                particle.style.animation = `float ${duration}s linear infinite`;
                particle.style.animationDelay = `-${Math.random() * 20}s`;

                container.appendChild(particle);
            }

            // Add keyframes dynamically
            const style = document.createElement('style');
            style.textContent = `
                @keyframes float {
                    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
                    10% { opacity: 1; }
                    90% { opacity: 1; }
                    100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
                }
            `;
            document.head.appendChild(style);
        }

        createParticles();
    </script>
</body>

</html>
