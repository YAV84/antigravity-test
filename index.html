<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Poem for Sheilla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #fb7185;
            --primary-hover: #f43f5e;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            background-image:
                radial-gradient(circle at top right, rgba(251, 113, 133, 0.15), transparent 40%),
                radial-gradient(circle at bottom left, rgba(14, 165, 233, 0.1), transparent 40%);
            color: var(--text-main);
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            box-sizing: border-box;
            perspective: 1000px;
            z-index: 10;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3.5rem 2rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s ease;
            animation: fadeIn 1s ease-out;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #fb7185, #f43f5e, #fb7185);
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(251, 113, 133, 0.15);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .heart-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(251, 113, 133, 0.1);
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
        }

        .heart-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 15px rgba(251, 113, 133, 0.6));
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 0 0 rgba(251, 113, 133, 0.4);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(251, 113, 133, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(251, 113, 133, 0);
            }
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.15);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.15);
            }
        }

        h1 {
            margin: 0 0 1rem;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #fb7185);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-size: 1.05rem;
            padding: 0 1rem;
        }

        .send-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 1.1rem 2.2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px -5px rgba(251, 113, 133, 0.5);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .send-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 60%);
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.3s, transform 0.5s;
        }

        .send-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 25px -5px rgba(251, 113, 133, 0.6);
        }

        .send-btn:hover::after {
            opacity: 1;
            transform: scale(1);
        }

        .send-btn span {
            position: relative;
            z-index: 1;
        }

        .send-btn svg {
            position: relative;
            z-index: 1;
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .send-btn:hover svg {
            transform: translateX(4px) translateY(-4px);
        }

        .floating-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>

<body>
    <div class="floating-particles" id="particles"></div>
    <div class="container">
        <div class="card">
            <div class="heart-container">
                <div class="heart-icon">💝</div>
            </div>
            <h1>For Sheilla</h1>
            <p>Click below to open your email client with a special poem ready to send to Sheilla.</p>

            <!-- Mailto link heavily URI encoded to preserve line breaks -->
            <a href="mailto:sheilla@example.com?subject=A%20Poem%20For%20You&body=Dear%20Sheilla%2C%0D%0A%0D%0AIn%20quiet%20moments%20when%20the%20world%20is%20still%2C%0D%0AMy%20thoughts%20of%20you%20the%20empty%20spaces%20fill.%0D%0AWith%20every%20dawn%20and%20every%20star%20above%2C%0D%0AYou%20are%20the%20endless%20center%20of%20my%20love.%0D%0A%0D%0AForever%20yours%2C%0D%0AYann"
                class="send-btn">
                <span>Send the Poem</span>
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                </svg>
            </a>
        </div>
    </div>

    <script>
        // Simple particle effect for extra aesthetics
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 20;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = Math.random() * 4 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = 'rgba(251, 113, 133, ' + (Math.random() * 0.3 + 0.1) + ')';
                particle.style.borderRadius = '50%';

                // Random positioning
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.top = Math.random() * 100 + 'vh';

                // Random animation
                const duration = Math.random() * 20 + 10;
                particle.style.animation = `float ${duration}s linear infinite`;
                particle.style.animationDelay = `-${Math.random() * 20}s`;

                container.appendChild(particle);
            }

            // Add keyframes dynamically
            const style = document.createElement('style');
            style.textContent = `
                @keyframes float {
                    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
                    10% { opacity: 1; }
                    90% { opacity: 1; }
                    100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
                }
            `;
            document.head.appendChild(style);
        }

        createParticles();
    </script>
</body>

</html>
